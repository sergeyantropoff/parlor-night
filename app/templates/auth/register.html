{% extends "base.html" %}
{% block title %}Регистрация — Parlor Night{% endblock %}
{% block content %}
<section class="login">
  <div class="login-brand">
    <a class="login-mark" href="/" aria-label="На главную">
      <img class="mark theme-light" src="/static/images/logo-mark-for-light.png?v={{ asset_version }}" alt="" />
      <img class="mark theme-dark" src="/static/images/logo-mark-for-dark.png?v={{ asset_version }}" alt="" />
    </a>
    <h1>Parlor Night</h1>
    <p>Гостиная настольных игр</p>
  </div>
  <form class="login-card" method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}" />
    {% if error %}<p class="banner" role="alert">{{ error }}</p>{% endif %}
    <label>
      <span class="field-name"><span class="field-title">Логин <span class="need" aria-hidden="true">*</span></span> <span class="field-hint">(Логин {{ site.username_min }}–{{ site.username_max }} символов.)</span></span>
      <input name="username" value="{{ username }}" autocomplete="username" required="required" minlength="{{ site.username_min }}" maxlength="{{ site.username_max }}" />
    </label>
    <label>
      <span class="field-name"><span class="field-title">Почта <span class="need" aria-hidden="true">*</span></span></span>
      <input name="email" type="email" value="{{ email }}" autocomplete="email" required="required" maxlength="200" />
    </label>
    <label>
      <span class="field-name"><span class="field-title">Пароль <span class="need" aria-hidden="true">*</span></span> <span class="field-hint">(Пароль от {{ site.password_min }}{% if site.password_needs_letter %}, с буквой{% endif %}{% if site.password_needs_digit %} и цифрой{% endif %}.)</span></span>
      <span class="password">
        <input name="password" type="password" autocomplete="new-password" required="required" minlength="{{ site.password_min }}" />
        <button type="button" class="tip-host" data-tip="Показать пароль" data-tip-edge aria-label="Показать пароль" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-eye"/></svg>
        </button>
      </span>
    </label>
    <label>
      <span class="field-name"><span class="field-title">Пароль ещё раз <span class="need" aria-hidden="true">*</span></span></span>
      <span class="password">
        <input name="password_repeat" type="password" autocomplete="new-password" required="required" minlength="{{ site.password_min }}" />
        <button type="button" class="tip-host" data-tip="Показать пароль" data-tip-edge aria-label="Показать пароль" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-eye"/></svg>
        </button>
      </span>
    </label>
    <fieldset class="robot">
      <legend>Проверка от ботов <span class="need" aria-hidden="true">*</span></legend>
      <label class="robot-row">
        <input type="checkbox" id="robot" required="required" />
        <span>Я не робот</span>
      </label>
      <input type="hidden" name="captcha" id="captcha-payload" value="" />
      <p id="robot-note" class="fine" hidden="hidden"></p>
    </fieldset>
    <button type="submit">Создать учётную запись</button>
    <p class="fine"><a href="/login">Уже есть учётная запись? Войти</a></p>
  </form>
  <p class="fine"><a href="/">На главную</a></p>
</section>
{% endblock %}
{% block scripts %}
<script type="module" src="/static/js/login.js?v={{ asset_version }}"></script>
{% endblock %}
