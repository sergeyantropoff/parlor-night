<footer class="site-foot">
  <a class="brand foot-brand" href="/">
    <img class="mark theme-light" src="/static/images/logo-mark-for-light.png?v={{ asset_version }}" width="258" height="263" alt="" />
    <img class="mark theme-dark" src="/static/images/logo-mark-for-dark.png?v={{ asset_version }}" width="258" height="263" alt="" />
    <span class="brand-title">Parlor Night</span>
    <span class="brand-rule">гостиная</span>
  </a>
  <div class="foot-links">
    <a href="/about"{% if path == "/about" %} aria-current="page"{% endif %}>О нас</a>
    <a href="/rules"{% if path == "/rules" %} aria-current="page"{% endif %}>Правила гостиной</a>
    <a href="/privacy"{% if path == "/privacy" %} aria-current="page"{% endif %}>Конфиденциальность</a>
    <a href="/contact"{% if path == "/contact" %} aria-current="page"{% endif %}>Связаться с нами</a>
    <a class="foot-map tip-host" href="/sitemap.xml" data-tip="Карта сайта" aria-label="Карта сайта">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="4.5" rx="1"/><rect x="3.5" y="16" width="6" height="4.5" rx="1"/><rect x="14.5" y="16" width="6" height="4.5" rx="1"/><path d="M12 8v3.5M12 11.5H6.5V16M12 11.5h5.5V16"/></svg>
    </a>
    <a class="foot-sign" href="https://antropoff.ru" target="_blank" rel="noopener noreferrer">© 2026 Сергей Антропов</a>
  </div>
</footer>
